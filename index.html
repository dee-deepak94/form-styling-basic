<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Styling</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Styling Form</h1>
        <form action="">
            <fieldset>
                <legend>Contact Us</legend>

                <label for="form-name">Your Name</label>
                <input type="text" name="" id="form-name">

                <label for="form-email">Your Email</label>
                <input type="email" name="" id="form-email">

                <label for="form-address">Your Address</label>
                <input type="text" name="" id="form-address">

                <label for="form-phone">Your Phone Numner</label>
                <input type="tel" name="" id="form-phone">

                <label for="form-message">Send a Message</label>
                <textarea name="" id="form-message"></textarea>

                <input type="submit" name="" id="" value="SEND MESSAGE">
            </fieldset>
        </form>
    </div>
</body>
</html>
